{% extends "base.html" %}

{% block content %}

<h2>Adicionar novo perfume</h2>

<form class="formulario" method="post">
    <input
        type="url"
        name="link_compra"
        placeholder="Cole o link do produto para buscar dados"
        value="{{ perfume.link_compra if perfume else '' }}"
    >

    <button type="submit" name="acao" value="importar" class="botao-secundario">
        Buscar dados do link
    </button>

    <div class="form-grid">
        <input type="text" name="nome" placeholder="Nome" value="{{ perfume.nome if perfume else '' }}" required>

        <input type="text" name="marca" placeholder="Marca" value="{{ perfume.marca if perfume else '' }}" required>

        <input type="text" name="tipo" placeholder="Tipo (ex: cítrico, fresco, unissex)" value="{{ perfume.tipo if perfume else '' }}">

        <select name="publico">
            <option value="">Público</option>
            <option value="masculino" {% if perfume and perfume.publico == "masculino" %}selected{% endif %}>Masculino</option>
            <option value="feminino" {% if perfume and perfume.publico == "feminino" %}selected{% endif %}>Feminino</option>
            <option value="unissex" {% if perfume and perfume.publico == "unissex" %}selected{% endif %}>Unissex</option>
        </select>

        <input type="text" name="preco" placeholder="Preço" value="{{ perfume.preco if perfume else '' }}">

        <input type="text" name="ocasiao" placeholder="Ocasião (ex: dia a dia, trabalho, calor)" value="{{ perfume.ocasiao if perfume else '' }}">

        <input type="text" name="fixacao" placeholder="Fixação (ex: suave, moderada, intensa)" value="{{ perfume.fixacao if perfume else '' }}">

        <input type="text" name="projecao" placeholder="Projeção (ex: discreta, moderada, marcante)" value="{{ perfume.projecao if perfume else '' }}">

        <input type="text" name="imagem" placeholder="Imagem ou URL da foto" value="{{ perfume.imagem if perfume else '' }}">

        <label class="check-editorial">
            <input
                type="checkbox"
                name="promocao_dia"
                {% if perfume and perfume.promocao_dia %}checked{% endif %}
            >
            Promoção do dia
        </label>
    </div>

    <textarea name="descricao" placeholder="Descrição">{{ perfume.descricao if perfume else '' }}</textarea>

    <textarea name="notas" placeholder="Notas olfativas (ex: bergamota, limão, musk)">{{ perfume.notas if perfume else '' }}</textarea>

    <button type="submit" name="acao" value="salvar">Salvar perfume</button>
</form>


<a href="{{ url_for('admin') }}" class="link-voltar">Voltar para o painel</a>

{% endblock %}
