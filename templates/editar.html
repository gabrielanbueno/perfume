{% extends "base.html" %}

{% block content %}

<h2>Editar perfume</h2>

<form class="formulario" method="post">
    <input
        type="url"
        name="link_compra"
        placeholder="Cole o link do produto para atualizar dados"
        value="{{ perfume.link_compra or '' }}"
    >

    <button type="submit" name="acao" value="importar" class="botao-secundario">
        Buscar dados do link
    </button>

    <div class="form-grid">
        <input type="text" name="nome" placeholder="Nome" value="{{ perfume.nome }}" required>

        <input type="text" name="marca" placeholder="Marca" value="{{ perfume.marca }}" required>

        <input type="text" name="tipo" placeholder="Tipo" value="{{ perfume.tipo or '' }}">

        <select name="publico">
            <option value="">Público</option>
            <option value="masculino" {% if perfume.publico == "masculino" %}selected{% endif %}>Masculino</option>
            <option value="feminino" {% if perfume.publico == "feminino" %}selected{% endif %}>Feminino</option>
            <option value="unissex" {% if perfume.publico == "unissex" %}selected{% endif %}>Unissex</option>
        </select>

        <input type="text" name="preco" placeholder="Preço" value="{{ perfume.preco or '' }}">

        <input type="text" name="ocasiao" placeholder="Ocasião" value="{{ perfume.ocasiao or '' }}">

        <input type="text" name="fixacao" placeholder="Fixação" value="{{ perfume.fixacao or '' }}">

        <input type="text" name="projecao" placeholder="Projeção" value="{{ perfume.projecao or '' }}">

        <input type="text" name="imagem" placeholder="Imagem ou URL da foto" value="{{ perfume.imagem or '' }}">

        <label class="check-editorial">
            <input
                type="checkbox"
                name="promocao_dia"
                {% if perfume.promocao_dia %}checked{% endif %}
            >
            Promoção do dia
        </label>
    </div>

    <textarea name="descricao" placeholder="Descrição">{{ perfume.descricao or '' }}</textarea>

    <textarea name="notas" placeholder="Notas olfativas">{{ perfume.notas or '' }}</textarea>

    <button type="submit" name="acao" value="salvar">Salvar alterações</button>
</form>

<a href="{{ url_for('admin') }}" class="link-voltar">
    Voltar para o painel
</a>

{% endblock %}
