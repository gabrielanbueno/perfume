<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Aura Cítrica{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="topbar">
        <div class="container topbar-conteudo">
            <a class="topbar-logo" href="{{ url_for('index') }}">Aura Cítrica</a>
            <div class="topbar-links">
                <a href="{{ url_for('index') }}">Início</a>
                <a href="{{ url_for('artigos') }}">Artigos</a>
                <a href="{{ url_for('perfumes') }}">Perfumes</a>
                <a href="{{ url_for('admin') }}">Admin</a>
            </div>
        </div>
    </nav>

    {% block conteudo %}{% endblock %}

    <footer>
        <div class="container">
            © {{ now.year if now is defined else 2025 }} Aura Cítrica — Blog editorial sobre fragrâncias
        </div>
    </footer>

</body>
</html>
